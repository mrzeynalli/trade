# Global Trade Intelligence — mounted at /trade on analytics.mrzeynalli.xyz.
#
# Included from the existing server block. "/trade" is a longer prefix than
# "/", so it wins the location match without reordering anything else, and no
# other route on this host is affected.

# The health endpoint is for local operators, not the public internet.
location = /trade/healthz {
    deny all;
}

# Hashed static assets: no rate limit and cached for a year.
#
# A single page can request well over a hundred country flags at once, which
# the API rate limit below would reject with 503. Immutable filenames make the
# separation safe: these bytes never change under a given URL.
location /trade/assets/ {
    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;

    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location /trade {
    limit_req zone=analytics_api burst=40 nodelay;

    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    proxy_pass_header Cache-Control;
}
